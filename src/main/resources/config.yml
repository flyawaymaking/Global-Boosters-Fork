max_active_boosters: 3

keep_effects_on_death: true

limited_supply_mode: false

max_supply_per_booster: 10

supply_reset_hour: 0

shop_gui_enabled: true

show_activator_name: true

negative_effects_enabled: true

# Enable or disable the BossBar display for active boosters.
bossbar_enabled: true

# Enable or disable the ActionBar display for active boosters.
# Useful as a lightweight alternative when bossbar is disabled.
actionbar_enabled: false

# Enable or disable all plugin sounds globally.
sounds_enabled: true

# Control the volume of all plugin sounds. 1.0 is max, 0.0 is muted.
sound_volume: 1.0

# Log all booster activations, expirations and queues to logs/booster_history.txt.
# Useful for admins to track usage and detect abuse.
history_log_enabled: false

# When enabled, if a booster type is already active, new activations
# will be queued and auto-activate once the current one expires.
# When disabled, duplicate activations are rejected.
booster_queue_enabled: false

  # Examples: UTC, GMT, America/New_York, Europe/London, Europe/Rome,
# Asia/Tokyo, America/Los_Angeles, Australia/Sydney
# Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
scheduled_boosters:
  enabled: true
  timezone: "Europe/Rome"
  schedules:
    strength_morning:
      enabled: false
      type: STRENGTH
      hour: 10
      minute: 0
      duration: 30
      activator_name: "Server"
      days:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
    exp_evening:
      enabled: false
      type: EXP_MULTIPLIER
      hour: 20
      minute: 0
      duration: 60
      activator_name: "Server"
      days:
        - FRIDAY
        - SATURDAY
        - SUNDAY
    speed_noon:
      enabled: false
      type: SPEED
      hour: 12
      minute: 0
      duration: 30
      activator_name: "Server"
      days:
        - SATURDAY
        - SUNDAY

random_scheduled_boosters:
  enabled: true
  interval_minutes: 30
  duration_minutes: 5
  activator_name: "Server"
  booster_pool:
    - PLANT_GROWTH
    - SPAWNER_RATE
    - EXP_MULTIPLIER
    - MOB_DROP
    - MINING_SPEED
    - FISHING_LUCK
    - FARMING_FORTUNE
    - COMBAT_DAMAGE
    - HASTE
    - RESISTANCE
    - JUMP_BOOST
    - REGENERATION
    - NIGHT_VISION
    - FIRE_RESISTANCE
    - SPEED
    - STRENGTH
    - NO_FALL_DAMAGE
    - HUNGER_SAVER
    - ARMOR_DURABILITY
    - KEEP_INVENTORY
    - FLY

